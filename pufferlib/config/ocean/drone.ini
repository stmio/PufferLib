[base]
package = ocean 
env_name = puffer_drone

[env]
num_envs = 1024

[train]
anneal_lr = false
batch_size = auto
checkpoint_interval = 50
bptt_horizon = 64
clip_coef = 0.2
clip_vloss = true
compile = false
compile_mode = reduce-overhead
cpu_offload = false
data_dir = experiments
device = cpu
ent_coef = 0.00004041
env_batch_size = 1
gae_lambda = 0.9514
gamma = 0.9896
learning_rate = 0.001377
max_grad_norm = 4.588
minibatch_size = 32768
norm_adv = true
num_envs = 1
num_workers = 1
total_timesteps = 1_000_000_000
update_epochs = 1
vf_clip_coef = 0.1
vf_coef = 0.5
zero_copy = true
seed = 16
torch_deterministic = False
target_kl = None
